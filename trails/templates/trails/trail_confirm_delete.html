{% extends 'trails/base.html' %}

{% block title %}Delete Trail | TrailMate{% endblock %}

{% block content %}
<h1>Delete Hiking Trail</h1>

<p>
    Are you sure you want to delete
    <strong>{{ trail.name }}</strong>?
</p>

<p>This action cannot be undone.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="button">Yes, Delete Trail</button>
    <a class="button" href="{% url 'trail-list' %}">Cancel</a>
</form>
{% endblock %}
