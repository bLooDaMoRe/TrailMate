{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TrailMate{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav class="navbar">
            <a class="logo" href="{% url 'home' %}">TrailMate</a>

            <div class="nav-links">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'trail-list' %}">Trails</a>
                <a href="{% url 'location-list' %}">Locations</a>
            </div>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>TrailMate — discover your next adventure.</p>
    </footer>
</body>
</html>
