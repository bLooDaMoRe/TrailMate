<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | TrailMate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f5f5f5;
            color: #222;
            font-family: Arial, sans-serif;
        }

        .error-page {
            width: 100%;
            max-width: 760px;
            padding: 60px 35px;
            text-align: center;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.07);
        }

        .error-code {
            margin: 0 0 22px;
            color: #666;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: clamp(36px, 6vw, 58px);
            line-height: 1.1;
        }

        .error-message {
            max-width: 570px;
            margin: 0 auto;
            color: #666;
            font-size: 17px;
            line-height: 1.7;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 32px;
        }

        .error-button {
            display: inline-block;
            padding: 14px 22px;
            border: 1px solid #222;
            border-radius: 6px;
            background: #222;
            color: #fff;
            font-size: 15px;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }

        .error-button:hover {
            background: #fff;
            color: #222;
        }

        .error-button.secondary {
            background: #fff;
            color: #222;
        }

        .error-button.secondary:hover {
            background: #222;
            color: #fff;
        }

        @media (max-width: 500px) {
            .error-page {
                padding: 40px 20px;
            }

            h1 {
                font-size: 36px;
            }

            .error-actions {
                flex-direction: column;
            }

            .error-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="error-page">
        <p class="error-code">ERROR 404</p>

        <h1>Looks like this trail ends here.</h1>

        <p class="error-message">
            Sorry, we couldn't find the page you were looking for.
            Let's get you back on the right path.
        </p>

        <div class="error-actions">
            <a class="error-button" href="/">Back to Home</a>
            <a class="error-button secondary" href="/trails/">Explore Trails</a>
        </div>
    </main>
</body>
</html>
